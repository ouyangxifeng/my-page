<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷炫粒子星空</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        .text-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: "Microsoft Yahei", sans-serif;
            font-size: 42px;
            letter-spacing: 8px;
            text-shadow: 0 0 10px #00ccff, 0 0 20px #00ccff;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>
    <div class="text-box">欢迎来到星空</div>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let stars = [];
        const starCount = 800;

        // 创建星星
        class Star {
            constructor() {
                this.x = Math.random() * w - w/2;
                this.y = Math.random() * h - h/2;
                this.z = Math.random() * w;
            }
            update() {
                this.z -= 4;
                if(this.z <= 0) {
                    this.z = w;
                    this.x = Math.random() * w - w/2;
                    this.y = Math.random() * h - h/2;
                }
            }
            draw() {
                const sx = (this.x / this.z) * w + w/2;
                const sy = (this.y / this.z) * h + h/2;
                const size = (1 - this.z / w) * 3;
                const alpha = 1 - this.z / w;
                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 204, 255, ${alpha})`;
                ctx.fill();
            }
        }

        for(let i=0;i<starCount;i++){
            stars.push(new Star());
        }

        function animate(){
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0,0,w,h);
            stars.forEach(s=>{
                s.update();
                s.draw();
            })
            requestAnimationFrame(animate);
        }
        animate();

        // 窗口大小适配
        window.addEventListener('resize',()=>{
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        })
    </script>
</body>
</html>
